name: CI

# Roda em todo pull request e nos pushes diretos à branch padrão, para a
# tabela nunca ser mesclada com dados que não fecham.
#
# O push é limitado a essas branches de propósito: uma branch com PR aberto
# já é coberta pelo gatilho pull_request, e deixar os dois pegarem a mesma
# branch fazia cada push disparar duas execuções idênticas.
on:
  push:
    branches:
      - main
      - claude/dreamy-heisenberg-ef2kzi
  pull_request:

# Um push novo cancela a execução anterior da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # package.json declara engines >= 20, então as duas pontas são testadas.
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

  seed:
    name: Seed em sincronia
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # O gerador só importa de src/data/ e de módulos nativos, então não
      # precisa de npm ci: nada a instalar.
      - name: Regerar o seed a partir de src/data/
        run: npm run seed

      - name: Conferir se o seed commitado está atualizado
        run: |
          if ! git diff --exit-code -- supabase/seed.sql; then
            echo "::error file=supabase/seed.sql::O seed saiu de sincronia com src/data/. Rode 'npm run seed' e comite o resultado."
            exit 1
          fi
